name: Frontend Staging Deploy

on:
  push:
    branches: [staging]
    paths:
      - "frontend/**"
      - "services/frontend/**"
      - ".github/workflows/deploy-staging.yml"
  pull_request:
    branches: [staging]
    paths:
      - "frontend/**"
      - "services/frontend/**"
      - ".github/workflows/deploy-staging.yml"

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Run tests
        run: npm test -- --ci --coverage

  deploy:
    name: Deploy to Staging
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: dataportation.ai
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/coa-migration/environments/staging/frontend
            git config --global --add safe.directory /opt/coa-migration/environments/staging/frontend
            git fetch origin staging
            git checkout staging
            git reset --hard origin/staging
            git clean -fd
            cd /opt/coa-migration/environments/staging
            docker compose -p coa-staging -f docker-compose.staging.yml build frontend
            docker compose -p coa-staging -f docker-compose.staging.yml up -d frontend
            docker restart coa-gateway-nginx
            echo "Staging frontend deployed from branch: staging"
