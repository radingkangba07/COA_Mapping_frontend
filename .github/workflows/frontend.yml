name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "services/frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "services/frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Run tests
        run: npm test -- --ci --coverage

  deploy-testing:
    name: Deploy to Testing
    needs: test
    if: >-
      (github.ref == 'refs/heads/develop' && github.event_name == 'push') ||
      (github.event_name == 'pull_request' && github.base_ref == 'develop')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            BRANCH="${{ github.head_ref || github.ref_name }}"
            cd /opt/coa-migration/environments/testing/frontend
            git config --global --add safe.directory /opt/coa-migration/environments/testing/frontend
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
            cd /opt/coa-migration/environments/testing
            docker compose -p coa-testing -f docker-compose.testing.yml build frontend
            docker compose -p coa-testing -f docker-compose.testing.yml up -d frontend
            docker restart coa-gateway-nginx
            echo "Testing frontend deployed from branch: $BRANCH"
