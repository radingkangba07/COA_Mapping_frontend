# Deploy frontend to testing/staging/production via SSH
# Only deploys after lint + tests pass
# Requires GitHub secrets: SSH_USER, SSH_PRIVATE_KEY

name: Deploy Frontend

on:
  push:
    branches:
      - main
      - staging
      - develop
    paths:
      - 'frontend/**'
      - 'services/frontend/**'

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Run tests
        run: npm test -- --ci --coverage

  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            echo "environment=testing" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 209.38.122.199
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/coa-migration
            ./deploy.sh ${{ steps.env.outputs.environment }} frontend